[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-scope"
version = "0.3.1"
description = "Evidence-first pharmaceutical research in your terminal"
requires-python = ">=3.11"
dependencies = ["textual>=0.80,<9", "PyMuPDF>=1.24,<2", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "langgraph>=1,<2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
ai = ["openai>=1.60,<3"]
search = ["ddgs>=9,<10"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
pharma = "pharma_scope.cli:main"

[tool.setuptools.packages.find]
include = ["pharma_scope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

