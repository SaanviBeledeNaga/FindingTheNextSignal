name: pharma-scope
services:
  agent:
    image: pharma-scope:0.4.0
    build: .
    env_file:
      - .env
    volumes:
      - research-data:/data
    stdin_open: true
    tty: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  research-data:
